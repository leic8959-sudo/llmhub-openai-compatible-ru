name: Update public model radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

concurrency:
  group: public-model-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify generator
        run: node --test tools/generate-weekly-report.test.mjs

      - name: Generate report from production catalog
        run: node tools/generate-weekly-report.mjs

      - name: Commit updated radar
        run: |
          if [ -z "$(git status --porcelain -- reports data)" ]; then
            echo "Model radar is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git commit -m "docs: update weekly model radar"
          git push
